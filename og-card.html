<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=Inter:wght@400;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #FBFBFC; color: #14171C;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    position: relative;
  }
  .pad { padding: 52px 56px 0; }
  h1 {
    font-family: 'IBM Plex Sans Condensed', Helvetica, sans-serif;
    font-weight: 700; font-size: 62px; line-height: 1.0;
    letter-spacing: -0.015em; margin: 0;
  }
  .sub { margin: 14px 0 0; font-size: 25px; line-height: 1.35; color: #4A515C; max-width: 46ch; }
  .band { position: absolute; left: 0; top: 300px; }
  .foot {
    position: absolute; left: 56px; right: 56px; bottom: 40px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 19px; color: #868C97;
  }
  .who { display: flex; align-items: center; gap: 14px; }
  .who img { width: 46px; height: 46px; border-radius: 11px; border: 1px solid #E4E6EB; }
  .tag { color: #D4451F; }
</style></head>
<body>
  <div class="pad">
    <h1>Travel Timeline&nbsp;Visualization</h1>
    <p class="sub">A trip drawn as its own duration. Every hour of the journey is one circle, dark through the night and pale through the day.</p>
  </div>
  <svg class="band" width="1200" height="250" viewBox="0 0 1200 250" font-family="Inter, sans-serif"></svg>
  <div class="foot">
    <div class="who"><img id="mark" alt=""><span>Arthur Beginyan</span></div>
    <span class="tag">A Figma plugin, in your browser</span>
  </div>
<script>
/* Same rules the tool uses: 24px per hour, night is hour &lt; 6 or &gt;= 18,
   and the coral bar spans an arrival to the next departure. Real values from
   the Yerevan to Hamburg trip: land 09:20, leave Hamburg Hbf 09:51 next day. */
var DOT = 22, HOUR_W = 24, PAD = 24, Y = 40;
var svg = document.querySelector('.band'), out = [];
var STAY_FROM = 9, STAY_TO = 33, COL = '#ff5630';

for (var h = 0; h < 49; h++) {
  var x = PAD + h * HOUR_W, hod = h % 24;
  var night = hod < 6 || hod >= 18;
  out.push('<circle cx="' + (x + DOT/2) + '" cy="' + (Y + DOT/2) + '" r="11" fill="' +
           (night ? 'rgb(38,38,38)' : 'rgb(191,191,191)') + '"/>');
  if (hod === 0) out.push('<text x="' + (x + DOT/2) + '" y="' + (Y + DOT/2) + '" font-size="9" font-weight="700" fill="#BFBFBF" text-anchor="middle" dominant-baseline="central">00</text>');
  if (hod === 12) out.push('<text x="' + (x + DOT/2) + '" y="' + (Y + DOT/2) + '" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">12</text>');
}
out.push('<text x="' + PAD + '" y="' + (Y - 26) + '" font-size="15" font-weight="700" fill="#333">July 6</text>');
out.push('<text x="' + (PAD + 24 * HOUR_W) + '" y="' + (Y - 26) + '" font-size="15" font-weight="700" fill="#333">July 7</text>');

out.push('<rect x="' + (PAD + STAY_FROM * HOUR_W) + '" y="' + (Y + DOT + 26) + '" width="' +
         ((STAY_TO - STAY_FROM) * HOUR_W) + '" height="5" fill="' + COL + '"/>');

function leg(x, city, time, zone, col, dim) {
  var g = ['<path d="M ' + x + ' ' + (Y + DOT + 8) + ' L ' + x + ' ' + (Y + DOT + 122) + '" stroke="#BFBFBF" stroke-width="1"/>'];
  g.push('<circle cx="' + (x + 17) + '" cy="' + (Y + DOT + 46) + '" r="6" fill="' + col + '"/>');
  g.push('<text x="' + (x + 29) + '" y="' + (Y + DOT + 52) + '" font-size="17" font-weight="700" fill="#333">' + city + '</text>');
  g.push('<text x="' + (x + 11) + '" y="' + (Y + DOT + 80) + '" font-size="23" font-weight="700" fill="' + (dim ? '#333333' : col) + '">' + time + '</text>');
  g.push('<text x="' + (x + 11) + '" y="' + (Y + DOT + 100) + '" font-size="13" fill="#999">' + zone + '</text>');
  return g.join('');
}
out.push(leg(PAD + 6.5 * HOUR_W, 'Yerevan', '06:30a', 'UTC+4', COL));
out.push(leg(PAD + 33 * HOUR_W, 'Hamburg Hbf', '09:51a', 'UTC+2', '#ffcb11', true));
svg.innerHTML = out.join('');
